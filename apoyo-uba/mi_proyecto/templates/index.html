<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apuntes UBA</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
body { font-family: Arial, sans-serif; background-color: #f5f5f5; padding: 20px; }
.titulo { font-size: 3rem; text-align: center; background: linear-gradient(90deg, #00CED1, #1E90FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
.form-container { background-color: #fff; border-radius: 10px; padding: 20px; max-width: 400px; margin: 20px auto; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
label { display: block; margin-bottom: 5px; font-weight: bold; }
input[type="text"], input[type="password"] { width: 100%; padding: 8px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; }
button { width: 100%; padding: 10px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
.boton-login { background-color: #1E90FF; color: #fff; }
.boton-login:hover { opacity: 0.9; }
.mensaje { text-align: center; font-weight: bold; margin-top: 10px; }
.materias-container { text-align: center; max-width: 400px; margin: 20px auto; }
.materia-btn { width: 100%; padding: 10px; border-radius: 5px; background-color: #0dd1c7; margin-bottom: 10px; font-weight: bold; cursor: pointer; }
.materia-btn:hover { opacity: 0.9; }
.hidden { display: none; }
</style>
</head>
<body>

<h1 class="titulo">Apuntes UBA</h1>

<!-- LOGIN -->
<div id="loginContainer" class="form-container">
  <h2>Iniciar Sesión</h2>
  <form id="loginForm">
    <label>Usuario:</label>
    <input type="text" id="usuario" required>
    <label>Contraseña:</label>
    <input type="password" id="password" required>
    <button type="submit" class="boton-login">Iniciar Sesión</button>
  </form>

  <!-- Google Sign-In -->
  <div id="googleLogin" style="margin-top:10px; text-align:center;">
    <div id="g_id_onload"
         data-client_id="1004413592803-otqevelf95i6lq073vng7pvrjv50gs0o.apps.googleusercontent.com"
         data-context="signin"
         data-callback="handleGoogleLogin"
         data-auto_prompt="false">
    </div>
    <div class="g_id_signin" data-type="standard"></div>
  </div>

  <p id="mensajeLogin" class="mensaje"></p>
  <p>¿No tienes cuenta? <a href="#" id="mostrarRegistro">Registrarse</a></p>
  <p><a href="#" id="olvidarPassword">Olvidé mi contraseña</a></p>
</div>

<!-- REGISTRO -->
<div id="registroContainer" class="form-container hidden">
  <h2>Registrar Usuario</h2>
  <form id="registroForm">
    <label>Usuario:</label>
    <input type="text" id="regUsuario" required>
    <label>Contraseña:</label>
    <input type="password" id="regPassword" required>
    <button type="submit" class="boton-login">Registrar</button>
  </form>
  <p id="mensajeRegistro" class="mensaje"></p>
  <p>¿Ya tienes cuenta? <a href="#" id="mostrarLogin">Iniciar Sesión</a></p>
</div>

<!-- MATERIAS -->
<div id="materiasContainer" class="materias-container hidden">
  <h2>Selecciona la materia</h2>
  <button class="materia-btn" data-materia="Inglés">Inglés</button>
  <button class="materia-btn" data-materia="Matemática">Matemática</button>
  <button class="materia-btn" data-materia="Química">Química</button>
  <button class="materia-btn" data-materia="DiseñoSoftware">DiseñoSoftware</button>
  <button class="materia-btn" data-materia="ProgramacionWeb">Programación Web</button>
  <button class="materia-btn" data-materia="ApoyoM">Apoyo M</button>
  <button class="materia-btn" data-materia="TAP">TAP</button>
  <button class="materia-btn" data-materia="AGBD">AGBD</button>
  <button class="materia-btn" data-materia="AED">AED</button>
</div>

<!-- FORMULARIO APUNTES -->
<div id="formContainer" class="form-container hidden">
  <h2 id="formTitle"></h2>
  <form id="materiaForm">
    <label>Apunte:</label>
    <input type="text" id="apunte" required>
    <button type="submit" class="boton-login">Agregar Apunte</button>
    <button type="button" id="volverMaterias" class="boton-login">Volver a Materias</button>
    <button type="button" id="cerrarSesion" class="boton-login">Cerrar Sesión</button>
  </form>
  <p id="mensajeForm" class="mensaje"></p>
</div>

<script>
const usuarios = JSON.parse(localStorage.getItem("usuarios") || "{}");

const loginContainer = document.getElementById("loginContainer");
const registroContainer = document.getElementById("registroContainer");
const materiasContainer = document.getElementById("materiasContainer");
const formContainer = document.getElementById("formContainer");
const loginForm = document.getElementById("loginForm");
const registroForm = document.getElementById("registroForm");
const materiaForm = document.getElementById("materiaForm");
const mensajeLogin = document.getElementById("mensajeLogin");
const mensajeRegistro = document.getElementById("mensajeRegistro");
const mensajeForm = document.getElementById("mensajeForm");
const formTitle = document.getElementById("formTitle");

document.getElementById("mostrarRegistro").onclick = () => { loginContainer.classList.add("hidden"); registroContainer.classList.remove("hidden"); };
document.getElementById("mostrarLogin").onclick = () => { registroContainer.classList.add("hidden"); loginContainer.classList.remove("hidden"); };

// Registro manual
registroForm.addEventListener("submit", e => {
    e.preventDefault();
    const u = regUsuario.value, p = regPassword.value;
    if(usuarios[u]) return mensajeRegistro.textContent = "Usuario ya existe";
    usuarios[u] = p;
    localStorage.setItem("usuarios", JSON.stringify(usuarios));
    mensajeRegistro.style.color = "green";
    mensajeRegistro.textContent = "Registrado con éxito";
});

// Login manual
loginForm.addEventListener("submit", e => {
    e.preventDefault();
    const u = usuario.value, p = password.value;
    if(usuarios[u] !== p) return mensajeLogin.textContent = "Credenciales incorrectas";
    loginExitoso(u);
});

// Google login
window.handleGoogleLogin = (response) => {
    const data = JSON.parse(atob(response.credential.split(".")[1]));
    loginExitoso(data.email);
};

function loginExitoso(user){
    localStorage.setItem("usuarioActual", user);
    loginContainer.classList.add("hidden");
    materiasContainer.classList.remove("hidden");
}

// Recuperar contraseña
document.getElementById("olvidarPassword").onclick = () => {
    const u = prompt("Usuario:");
    alert(usuarios[u] ? `Tu contraseña es: ${usuarios[u]}` : "No existe");
};

// Materias
document.querySelectorAll(".materia-btn").forEach(btn => btn.onclick = () => {
    formTitle.textContent = `Agregar Apunte de ${btn.textContent}`;
    materiasContainer.classList.add("hidden");
    formContainer.classList.remove("hidden");
    mensajeForm.textContent = "";
    materiaForm.reset();
});

// Formulario apuntes
materiaForm.addEventListener("submit", e => {
    e.preventDefault();
    alert("Acá se enviará al backend en la próxima etapa");
    formContainer.classList.add("hidden");
    materiasContainer.classList.remove("hidden");
});

// Volver botones
volverMaterias.onclick = () => { formContainer.classList.add("hidden"); materiasContainer.classList.remove("hidden"); };
cerrarSesion.onclick = () => { formContainer.classList.add("hidden"); materiasContainer.classList.add("hidden"); loginContainer.classList.remove("hidden"); localStorage.removeItem("usuarioActual"); };
</script>

</body>
</html>
